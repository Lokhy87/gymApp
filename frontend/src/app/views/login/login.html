<div class="auth-wrapper">
    <div class="auth-card">

        <h1 class="auth-title">
            Login
        </h1>

        <p class="auth-subtitle">
            Access your account
        </p>

        <form (ngSubmit)="onLogin()" class="auth-form">

            <div class="mb-3">
                <input
                    type="text"
                    name="username"
                    [(ngModel)]="loginData.username"
                    class="form-control"
                    placeholder="Username or email"
                    required
                />
            </div>

            <div class="mb-3">
                <input
                    type="password"
                    name="password"
                    [(ngModel)]="loginData.password"
                    class="form-control"
                    placeholder="Password"
                    required
                />
            </div>

            <div class="auth-options mb-3">
                <div class="form-check">
                    <input
                        name="remember"
                        [(ngModel)]="loginData.remember"
                        class="form-check-input"
                        type="checkbox"
                        id="rememberCheck"
                    />

                    <label
                        class="form-check-label"
                        for="rememberCheck"
                    >
                        Remember me
                    </label>
                </div>

                <a
                    href="#"
                    class="forgot-link"
                >
                    Forgot password?
                </a>
            </div>

            <button
                type="submit"
                class="btn-auth"
            >
                Sign in
            </button>

        </form>

        <div class="auth-footer">
            <span>
                New here?
            </span>

            <a routerLink="/register">
                Create an account
            </a>

            <div class="auth-back">
                <a routerLink="/">
                    ← Back
                </a>
            </div>
        </div>

    </div>
</div>
