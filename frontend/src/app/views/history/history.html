<div class="container">
    <full-calendar [options]="calendarOptions" class="p-5"></full-calendar>    
</div>

@if (showModal) {
<div class="custom-modal-backdrop">
  <div class="custom-modal">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h4>Workout - {{ selectedDate }}</h4>
      <button class="btn modal-btn" (click)="closeModal()">X</button>
    </div>

    @for (exercise of selectedExercises; track exercise.name) {
      <div class="exercise-card mb-3 p-3 rounded border">
        <div class="d-flex flex-wrap justify-content-between align-items-center">
          <div>
            <h5>{{ exercise.name }}</h5>
            <small>
              {{ exercise.sets }} sets • {{ exercise.reps }} reps
            </small>
          </div>
          <div class="d-flex gap-2 mt-2">
            <button class="btn modal-btn">See</button>
            <button class="btn modal-btn">Edit</button>
            <button class="btn modal-btn">Delete</button>
          </div>
        </div>
      </div>
    }

    @if (selectedExercises.length === 0) {
      <p>No exercises for this date.</p>
    }
  </div>
</div>
}
