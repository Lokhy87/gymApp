<div class="profile-container">

    <h2 class="title">Your Profile</h2>

    @if (loading) {
    <div class="loading">Loading...</div>
    }

    @if (!loading) {

    @if (!editMode) {
    <div class="profile-view">

        <!-- Campo Nombre Añadido -->
        <div class="row">
            <span class="label">Name:</span>
            <span class="value">{{ user.name }}</span>
        </div>

        <div class="row">
            <span class="label">Username:</span>
            <span class="value">{{ user.username }}</span>
        </div>

        <div class="row">
            <span class="label">Email:</span>
            <span class="value">{{ user.email }}</span>
        </div>

        <div class="row">
            <span class="label">Location:</span>
            <span class="value">{{ user.location }}</span>
        </div>

        <div class="actions">
            <button class="btn" (click)="editProfile()">Edit</button>
            <button class="btn danger" (click)="deleteAccount()">Delete Account</button>
        </div>

    </div>
    }

    @if (editMode) {
    <form class="profile-edit">

        <!-- Input de Nombre Añadido para edición -->
        <div class="form-group">
            <label>Name</label>
            <input type="text" [(ngModel)]="user.name" name="name">
        </div>

        <div class="form-group">
            <label>Username</label>
            <input type="text" [(ngModel)]="user.username" name="username">
        </div>

        <div class="form-group">
            <label>Email</label>
            <input type="email" [(ngModel)]="user.email" name="email">
        </div>

        <div class="form-group">
            <label>Location</label>
            <input type="text" [(ngModel)]="user.location" name="location">
        </div>

        <div class="actions">
            <button class="btn" type="button" (click)="saveProfile()" [disabled]="saving">

                @if (!saving) {
                Save
                }

                @if (saving) {
                Saving...
                }
            </button> <button class="btn secondary" type="button" (click)="editProfile()">Cancel</button>
        </div>

    </form>
    }

    }

</div>
