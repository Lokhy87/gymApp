<div class="main-content">
    <div class="profile-card">
        <div class="card-title text-center mb-4">
            <img src="" alt="" class="img rounded-circle">
            <h3>Your Profile</h3>
        </div>
        @if (!editMode) {
            <div>
                <p><strong>Username: </strong> {{user.username}}</p>
                <p><strong>Email: </strong>{{user.email}}</p>
                <p><strong>Password: </strong>{{user.password}}</p>
                <p><strong>Location: </strong>{{user.location}}</p>
            </div>

            <div class="d-flex justify-content-between mt-4">
                <button class="btn" (click)="editProfile()">Edit</button>
                <button class="btn" (click)="deleteAccount()">Delete Account</button>
            </div>
        }

        @if (editMode) {
            <form action="">
                <div class="mb-3">
                    <label for="username">Username</label>
                    <input type="text" class="form-control" value="{{user.username}}">
                </div>

                <div class="mb-3">
                    <label for="email">Email</label>
                    <input type="text" class="form-control" value="{{user.email}}">
                </div>

                <div class="mb-3">
                    <label for="password">Password</label>
                    <input type="text" class="form-control" value="{{user.password}}">
                </div>

                <div class="mb-3">
                    <label for="location">Location</label>
                    <input type="text" class="form-control" value="{{user.location}}">
                </div>

                <button (click)="editProfile()" class="btn">Return</button>
                <input type="submit" class="btn">
            </form>
        }
        
    </div>
</div>
