<div class="auth-wrapper">

  <div class="auth-card">

    <h1 class="auth-title">
      Create account
    </h1>

    <p class="auth-subtitle">
      Start your fitness journey
    </p>

    <form (ngSubmit)="onRegister()">

      <!-- Username -->
      <div class="mb-3">
        <input
          type="text"
          name="username"
          [(ngModel)]="registerData.username"
          class="form-control"
          placeholder="Choose a username"
          required
        />
      </div>

      <!-- Email -->
      <div class="mb-3">
        <input
          type="email"
          name="email"
          [(ngModel)]="registerData.email"
          class="form-control"
          placeholder="Enter your email"
          required
        />
      </div>

      <!-- Password -->
      <div class="mb-3">
        <input
          type="password"
          name="password"
          [(ngModel)]="registerData.password"
          class="form-control"
          placeholder="Create a password"
          required
        />
      </div>

      <!-- Location -->
      <div class="mb-3">
        <select
          name="location"
          [(ngModel)]="registerData.location"
          class="form-control"
          required
        >
          <option value="" disabled selected>Select location</option>
          <option value="Valencia">Valencia Office / Gym</option>
          <option value="Alicante">Alicante Gym</option>
          <option value="Castellon">Castellón Gym</option>
        </select>
      </div>

      <!-- Button -->
      <button type="submit" class="btn-auth">
        Create account
      </button>

    </form>

    <!-- Terms -->
    <div class="auth-terms">
      By creating an account, you agree to our
      <a href="#">Terms of Service</a>
      and
      <a href="#">Privacy Policy</a>.
    </div>

    <!-- Footer -->
    <div class="auth-footer">
      Already have an account?
      <a routerLink="/login">Login</a>
    </div>

    <div class="text-center mt-3">
      <a routerLink="/" class="text-white text-decoration-none">
        ← Back
      </a>
    </div>

  </div>

</div>
