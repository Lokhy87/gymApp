security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        login:
            pattern: ^/api/login_check
            stateless: true
            json_login:
                check_path: /api/login_check
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure

        api:
            pattern: ^/api
            stateless: true
            jwt: ~

        main:
            lazy: true
            provider: app_user_provider
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
            logout:
                path: app_logout

    access_control:
        # 1. El punto de entrada para obtener el token DEBE ser público
        - { path: ^/api/login_check, roles: PUBLIC_ACCESS }

        # 2. CUALQUIER otra ruta que empiece por /api requiere login total
        # Al quitar las reglas de PUBLIC_ACCESS de arriba, estas quedan protegidas
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }

        # 3. Reglas para el panel de administración (si usas EasyAdmin o similar)
        - { path: ^/admin, roles: ROLE_ADMIN }
